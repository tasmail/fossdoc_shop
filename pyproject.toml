[project]
name = "fossdoc_shop"
authors = [{ name = "FOSS-On-Line", email = "foss@foss.ua" }]
description = "FossDoc shop: calculation e-mail, commercial offer PDF and orders"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
